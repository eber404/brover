<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>brover</title>
<style>
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #070b12;
        font-family: 'IBM Plex Sans', 'Avenir Next', 'Segoe UI', sans-serif;
        z-index: 9999;
        transition: opacity 200ms ease-out;
        -webkit-app-region: drag;
      }
      #app-loading.fade-out {
        opacity: 0;
      }
      .app-loading-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 96px;
        -webkit-app-region: no-drag;
      }
      .app-loading-grid {
        display: grid;
        grid-template-columns: repeat(3, 6px);
        gap: 8px;
      }
      .app-loading-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #1d2b3f;
      }
      .app-loading-title {
        font-size: 24px;
        font-weight: 600;
        color: #f1f5f9;
        letter-spacing: 0.04em;
        line-height: 1.2;
      }
      .app-loading-tagline {
        font-size: 12px;
        font-weight: 400;
        color: #94a3b8;
        letter-spacing: 0.02em;
        margin-top: -16px;
      }


    </style>
  </head>
  <body>
    <div id="app-loading">
      <div class="app-loading-inner">
        <div class="app-loading-grid">
        <div class="app-loading-dot" style="grid-area:1/1"></div>
        <div class="app-loading-dot" style="grid-area:1/2"></div>
        <div class="app-loading-dot" style="grid-area:1/3"></div>
        <div class="app-loading-dot" style="grid-area:2/1"></div>
        <div class="app-loading-dot" style="grid-area:2/3"></div>
        <div class="app-loading-dot" style="grid-area:3/1"></div>
        <div class="app-loading-dot" style="grid-area:3/2"></div>
        <div class="app-loading-dot" style="grid-area:3/3"></div>
      </div>
      <div class="app-loading-title">brover</div>
      <div class="app-loading-tagline">Your local secrets manager</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
    <script>
      (function() {
        var dots = document.querySelectorAll('.app-loading-dot');
        var seq = [0, 1, 2, 4, 7, 6, 5, 3];
        var i = 0;
        var prev = -1;
        setInterval(function() {
          if (prev !== -1) dots[prev].style.background = '';
          dots[seq[i]].style.background = 'rgba(31,182,255,0.3)';
          prev = seq[i];
          i = (i + 1) % seq.length;
        }, 162);
      })();
    </script>
  </body>
</html>
