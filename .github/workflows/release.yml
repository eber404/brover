name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build macOS installers
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript check
        run: bun run tsc

      - name: Run unit tests
        run: bun run test

      - name: Build app bundles
        run: bun run build

      - name: Build macOS arm64 DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: bunx electron-builder --mac dmg --arm64 --publish never

      - name: Upload arm64 DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: Brover-arm64
          path: release/Brover-*-arm64.dmg

      - name: Build macOS x64 DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: bunx electron-builder --mac dmg --x64 --publish never

      - name: Upload x64 DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: Brover-x64
          path: release/Brover-*-x64.dmg

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-macos

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.dmg
