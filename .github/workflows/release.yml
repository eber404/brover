name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build macOS installers
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript check
        run: bun run tsc

      - name: Run unit tests
        run: bun run test

      - name: Build app bundles
        run: bun run build

      - name: Build macOS arm64 DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: bunx electron-builder --mac dmg --arm64 --publish never

      - name: Upload arm64 DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: Brover-arm64
          path: release/Brover-*-arm64.dmg

      - name: Build macOS x64 DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: bunx electron-builder --mac dmg --x64 --publish never

      - name: Upload x64 DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: Brover-x64
          path: release/Brover-*-x64.dmg

  publish-release-and-update-cask:
    name: Publish Release & Update Cask
    runs-on: ubuntu-latest
    needs: build-macos

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.dmg

      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Update cask
        run: |
          set -euo pipefail
          arm64_sha=$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "Brover-'"${GITHUB_REF_NAME#v}"'-arm64.dmg") | .digest' | sed 's/^sha256://')
          x64_sha=$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "Brover-'"${GITHUB_REF_NAME#v}"'-x64.dmg") | .digest' | sed 's/^sha256://')

          cat > Casks/brover.rb <<EOF
          # frozen_string_literal: true

           cask "brover" do
             arch arm: "arm64", intel: "x64"

             version "${GITHUB_REF_NAME#v}"
             sha256 arm:   "$arm64_sha",
                    intel: "$x64_sha"

             url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/Brover-#{version}-#{arch}.dmg"
             name "Brover"
             desc "Local environment secret manager"
            homepage "https://github.com/${GITHUB_REPOSITORY}"

            app "Brover.app"

            zap trash: "~/Library/Application Support/brover"
          end
          EOF

          if git diff --quiet; then
            exit 0
          fi
          git add Casks/brover.rb
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore: update brover cask to ${GITHUB_REF_NAME#v}"
          git push origin main
