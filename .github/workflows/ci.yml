name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run tsc

  unit-tests:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage summary
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json

  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary manually
        run: |
          set -eux
          ELECTRON_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")
          echo "Using Electron ${ELECTRON_VERSION}"
          curl -fsSL -o /tmp/electron.zip "https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-linux-x64.zip"
          rm -rf /tmp/electron-extract && mkdir -p /tmp/electron-extract
          unzip -q /tmp/electron.zip -d /tmp/electron-extract
          # Keep npm-installed package.json + nested deps, replace dist/ with extracted binary
          rm -rf node_modules/electron/dist node_modules/electron/path.txt
          cp -r /tmp/electron-extract/* node_modules/electron/
          printf 'electron' > node_modules/electron/path.txt
          echo "v${ELECTRON_VERSION}" > node_modules/electron/dist/version
          test -x node_modules/electron/dist/electron
          test -f node_modules/electron/path.txt

      - name: Install Playwright dependencies
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: xvfb-run --auto-servernum npm run test:e2e

  publish-coverage-badge:
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download coverage summary
        uses: actions/download-artifact@v8
        with:
          name: coverage-summary
          path: coverage

      - name: Generate coverage badge
        run: npm run coverage:badge

      - name: Publish badge branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: badges
          publish_dir: .badge-dist
          force_orphan: true
          enable_jekyll: false
